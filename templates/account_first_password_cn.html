{% extends "base_cn.html" %}
{% block title %}修改初始密码 - MAPS{% endblock %}
{% block page_title %}首次登录安全设置{% endblock %}
{% block page_subtitle %}请设置符合强度要求的新密码后方可使用系统{% endblock %}
{% block content %}
<div class="container" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <p class="text-muted small">密码至少 8 位，需包含大写、小写、数字与特殊字符。</p>
            <form method="post" action="{{ url_for('change_initial_password') }}">
                <div class="mb-3">
                    <label class="form-label">新密码</label>
                    <input type="password" name="password" class="form-control" required autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label">确认新密码</label>
                    <input type="password" name="password2" class="form-control" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">确认修改</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
