# MAPS Nginx 反向代理配置
# 部署：sudo cp deploy/nginx/maps.conf /etc/nginx/conf.d/maps.conf
#       sudo nginx -t && sudo systemctl reload nginx
# 有域名后：sudo certbot --nginx -d <你的域名>  自动签发HTTPS并改写本配置
server {
    listen 80;
    # 无域名时可用 _ 匹配任意Host（按IP访问）；有域名改为实际域名
    server_name _;

    # 与应用 MAX_CONTENT_LENGTH=4G 对齐，支持大文件/分片上传
    client_max_body_size 4096M;

    # 说明：上传文件统一走 Flask 鉴权端点 /uploads/<filename>，
    # 不再由 nginx 直接 alias 暴露 uploads 目录（该目录位于 750 权限的 /home/ubuntu 下，
    # nginx worker(www-data) 无权读取，直出只会 403，且存在越权直链风险）。

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
